name: Deploy to Tencent Cloud

# 触发条件：当 main 分支有代码 push 时触发
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 使用 GitHub 提供的免费服务器进行打包

    steps:
      # 1. 拉取最新代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 pnpm（不写 version，从 package.json 的 packageManager 读取，避免重复指定报错）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. 配置 Node.js（cache 需在 pnpm 已安装后使用）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # 4. 安装依赖并打包（monorepo：构建 web + server）
      - name: Install and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 5. 准备部署目录（仅 server 的 dist 和 package.json）
      - name: Prepare deploy artifacts
        run: |
          mkdir -p deploy
          cp -r apps/server/dist deploy/
          cp apps/server/package.json deploy/

      # 6. 将构建产物传到服务器项目目录
      - name: SCP Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'deploy/dist,deploy/package.json'
          target: /home/projects/watermark-remover
          strip_components: 0

      # 7. 远程登录服务器，安装生产依赖
      - name: SSH and Install Dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            [ -f ~/.nvm/nvm.sh ] && . ~/.nvm/nvm.sh
            [ -f ~/.bashrc ] && . ~/.bashrc
            [ -f ~/.profile ] && . ~/.profile
            cd /home/projects/watermark-remover
            pnpm install --prod
